<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citas | Odontología Especializada</title>
    <link rel="icon" href="../iconos/favicon2.ico" type="image/x-icon">
    <link rel="stylesheet" href="../estilos/global.css">
    <link rel="stylesheet" href="../estilos/header.css">
    <link rel="stylesheet" href="../estilos/citas.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body>
    <div class="contenedor-principal">
        <div class="header" id="header">
            <img src="../iconos/logo.png" alt="logo">

            <div class="menu" id="menu">
                <a href="../adminDashboard.html" class="opcion">Inicio</a>
                <a href="#" class="opcion activo">Citas</a>
                <a href="../recursos/pacientes.html" class="opcion">Pacientes</a>
                <a href="../recursos/usuarios.html" class="opcion">Usuarios</a>
                <a href="../recursos/horarios.html" class="opcion">Horarios</a>
                <a href="../recursos/bitacora.html" class="opcion">Bitácora</a>
                <div class="linea-flotante"></div>
            </div>

            <div class="perfil-contenedor">
                <!-- Quitamos el onclick de aquí y le ponemos un ID para controlarlo con JS -->
                <div class="perfil" id="btnPerfilDropdown">
                    <button class="btn-perfil"><img class="pfp" src="../iconos/perfil.png" alt=""></button>
                    <p>Administrador</p>
                    <i class="bi bi-chevron-down flecha-perfil"></i> <!-- Opcional: una flechita para indicar menú -->
                </div>
                <!-- El pequeño modal flotante -->
                <div class="dropdown-perfil" id="dropdownPerfil">
                    <a href="../recursos/cliPerfil.html" class="dropdown-item">
                        <i class="bi bi-gear"></i> Configuración de cuenta
                    </a>
                    <hr class="dropdown-divisor">
                    <a href="../index.html" class="dropdown-item texto-peligro">
                        <i class="bi bi-box-arrow-right"></i> Cerrar sesión
                    </a>
                </div>
            </div>

        </div>

        <div class="contenedor" id="contenedor">

            <div id="notice" role="status" aria-live="polite"></div><section class="citas-modulo">
            <div class="panel">
                <div class="panel-head">
                    <h2><i class="bi bi-calendar-check"></i> Administración de citas</h2><button class="primary"
                        data-action="newAppointment">+ Nueva cita</button>
                </div>
                <div class="filters"><input id="searchAppointment"
                        placeholder="Buscar paciente, folio u odontólogo"><select id="filterService">
                        <option value="">Todos los servicios</option>
                    </select><select id="filterStatus">
                        <option value="">Todos los estados</option>
                        <option>Pendiente</option>
                        <option>Confirmada</option>
                        <option>Terminada</option>
                        <option>Cancelada</option>
                    </select><input id="filterDate" type="date"><button class="soft" id="clearFilters">Limpiar</button>
                </div>
                <div class="calendar-head"><button class="soft" id="prevMonth">‹</button>
                    <h3 id="calendarLabel"></h3><button class="soft" id="nextMonth">›</button><button class="soft"
                        id="todayMonth">Hoy</button>
                </div>
                <div class="calendar" id="calendar"></div>
                <h3>Registros de citas</h3>
                <div class="tablewrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Folio / fecha</th>
                                <th>Paciente</th>
                                <th>Servicio</th>
                                <th>Odontólogo</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="appointmentsBody"></tbody>
                    </table>
                </div>
            </div>
        </section>
        </div>
    </div>
    <div class="overlay hidden" id="modal"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="panel-head"><h2 id="modalTitle"></h2><button class="close" id="closeModal" aria-label="Cerrar">×</button></div><div id="modalContent"></div></div></div>
</body>
<script src="../scripts/adminHeader.js"></script>
<script src="../scripts/citas.js"></script>
</html>
