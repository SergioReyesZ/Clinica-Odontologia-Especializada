<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios | Odontología Especializada</title>
    <link rel="icon" href="../iconos/favicon2.ico" type="image/x-icon">
    <link rel="stylesheet" href="../estilos/global.css">
    <link rel="stylesheet" href="../estilos/header.css">
    <link rel="stylesheet" href="../estilos/usuarios.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../estilos/responsive-mobile.css">
</head>

<body>
    <div class="contenedor-principal">
        <div class="header" id="header">
            <img src="../iconos/logo.png" alt="logo">
            <button class="hamburger-btn" id="hamburger-btn" type="button" aria-label="Abrir menú" aria-expanded="false">
                <i class="bi bi-list" aria-hidden="true"></i>
            </button>


            <div class="menu" id="menu">
                <a href="../adminDashboard.html" class="opcion">Inicio</a>
                <a href="../recursos/citas.html" class="opcion">Citas</a>
                <a href="../recursos/pacientes.html" class="opcion">Pacientes</a>
                <a href="../recursos/usuarios.html" class="opcion activo">Usuarios</a>
                <a href="../recursos/horarios.html" class="opcion">Horarios</a>
                <a href="../recursos/bitacora.html" class="opcion">Bitácora</a>
                <a href="../recursos/admServicios.html" class="opcion">Servicios</a>

                <div class="linea-flotante"></div>
            </div>

            <div class="perfil-contenedor">
                <!-- Quitamos el onclick de aquí y le ponemos un ID para controlarlo con JS -->
                <div class="perfil" id="btnPerfilDropdown">
                    <button class="btn-perfil"><img class="pfp" src="../iconos/perfil.png" alt=""></button>
                    <p>Administrador</p>
                    <i class="bi bi-chevron-down flecha-perfil"></i> <!-- Opcional: una flechita para indicar menú -->
                </div>
                <!-- El pequeño modal flotante -->
                <div class="dropdown-perfil" id="dropdownPerfil">

                    <!-- Identidad del administrador -->
                    <div class="dropdown-identidad">
                        <strong id="admin-nombre-dropdown">Cargando...</strong>
                        <span>Administrador</span>
                    </div>

                    <a href="perfil.html" class="dropdown-item">
                        <i class="bi bi-gear"></i> Configuración de cuenta
                    </a>
                    <hr class="dropdown-divisor">
                    <a href="#" id="btnCerrarSesion" class="dropdown-item texto-peligro">
                        <i class="bi bi-box-arrow-right"></i> Cerrar sesión
                    </a>
                </div>
            </div>

        </div>
    </div>
    <main class="contenedor" id="contenedor">
        <div id="notice" role="status" aria-live="polite"></div>
        <section class="admin-module">
            <div class="panel">
                <div class="panel-head">
                    <h2><i class="bi bi-person-gear"></i> Usuarios del sistema</h2><button class="primary"
                        data-action="newUser">+ Registrar usuario</button>
                </div>
                <div class="filters"><input id="searchUser" placeholder="Buscar nombre o correo"><select
                        id="filterRole">
                        <option value="">Todos los roles</option>
                        <option>Cliente</option>
                        <option>Odontólogo</option>
                        <option>Administrador</option>
                    </select></div>
                <div class="tablewrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Correo</th>
                                <th>Rol</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="usersBody"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>
    <div class="overlay hidden" id="modal">
        <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="panel-head">
                <h2 id="modalTitle"></h2><button class="close" id="closeModal" aria-label="Cerrar">×</button>
            </div>
            <div id="modalContent"></div>
        </div>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../scripts/app.js"></script>
<script src="../scripts/seguridadAdmin.js"></script>
<script src="../scripts/adminHeader.js"></script>
<script src="../scripts/usuarios.js"></script>

</html>
