<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis citas | Odontología Especializada</title>
    <link rel="icon" href="../iconos/favicon2.ico" type="image/x-icon">
    <link rel="stylesheet" href="../estilos/global.css">
    <link rel="stylesheet" href="../estilos/header.css">
    <link rel="stylesheet" href="../estilos/citas.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../estilos/responsive-mobile.css">
</head>
<body>
    <div class="contenedor-principal">
        <div class="header" id="header">
            <img src="../iconos/logo.png" alt="logo">
            <button class="hamburger-btn" id="hamburger-btn" type="button" aria-label="Abrir menú" aria-expanded="false">
                <i class="bi bi-list" aria-hidden="true"></i>
            </button>
            <div class="menu" id="menu">
                <a href="../odontologoDashboard.html" class="opcion">Inicio</a>
                <a href="#" class="opcion activo" aria-current="page">Citas</a>
                <div class="linea-flotante"></div>
            </div>
            <div class="perfil-contenedor">
                <button class="btn-notificaciones" id="btnNotificacionesDropdown" type="button" aria-label="Notificaciones">
                    <i class="bi bi-bell"></i>
                    <span id="contadorNotificaciones" class="contador-notificaciones" style="display:none;">0</span>
                </button>
                <div class="dropdown-notificaciones" id="dropdownNotificaciones">
                    <div class="notificaciones-encabezado"><strong>Notificaciones</strong></div>
                    <div id="listaNotificaciones"><p class="sin-notificaciones">Cargando notificaciones...</p></div>
                </div>
                <div class="perfil" id="btnPerfilDropdown">
                    <button class="btn-perfil" type="button"><img class="pfp" src="../iconos/perfil.png" alt="Foto de perfil"></button>
                    <p id="header-nombre-usuario">Odontólogo</p>
                    <i class="bi bi-chevron-down flecha-perfil"></i>
                </div>
                <div class="dropdown-perfil" id="dropdownPerfil">
                    <a href="perfil.html" class="dropdown-item"><i class="bi bi-gear"></i> Configuración de cuenta</a>
                    <hr class="dropdown-divisor">
                    <a href="#" id="btnCerrarSesion" class="dropdown-item texto-peligro"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</a>
                </div>
            </div>
        </div>

        <main class="contenedor" id="contenedor">
            <div id="notice" role="status" aria-live="polite"></div>
            <section class="citas-modulo">
                <div class="panel">
                    <div class="panel-head">
                        <h2><i class="bi bi-calendar-check"></i> Mis citas</h2>
                    </div>
                    <div class="filters">
                        <input id="searchAppointment" type="search" placeholder="Buscar paciente, folio o servicio" autocomplete="off">
                        <select id="filterService"><option value="">Todos los servicios</option></select>
                        <select id="filterStatus">
                            <option value="">Todos los estados</option>
                            <option value="PENDIENTE">Pendiente</option>
                            <option value="CONFIRMADA">Confirmada</option>
                            <option value="TERMINADA">Terminada</option>
                            <option value="CANCELADA">Cancelada</option>
                        </select>
                        <button class="soft" id="clearFilters" type="button">Limpiar</button>
                    </div>
                    <div class="calendar-head">
                        <button class="soft" id="prevMonth" type="button" aria-label="Mes anterior">‹</button>
                        <h3 id="calendarLabel"></h3>
                        <button class="soft" id="nextMonth" type="button" aria-label="Mes siguiente">›</button>
                        <button class="soft" id="todayMonth" type="button">Hoy</button>
                    </div>
                    <div class="calendar" id="calendar" aria-label="Calendario de citas"></div>
                    <h3>Registros de citas</h3>
                    <div class="tablewrap">
                        <table>
                            <thead><tr>
                                <th>Folio / fecha</th><th>Paciente</th><th>Servicio</th><th>Odontólogo</th><th>Estado</th><th>Acciones</th>
                            </tr></thead>
                            <tbody id="appointmentsBody"><tr><td colspan="6" class="emptymsg">Cargando tus citas...</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../scripts/app.js"></script>
    <script src="../scripts/seguridadOdontologo.js"></script>
    <script src="../scripts/odontologoHeader.js"></script>
    <script src="../scripts/notificaciones.js"></script>
    <script src="../scripts/odontologo.js"></script>
    <script src="../scripts/odontologoCitas.js"></script>
</body>
</html>
