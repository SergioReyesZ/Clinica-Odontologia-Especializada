<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel | Odontología Especializada</title>
    <link rel="icon" href="iconos/favicon2.ico" type="image/x-icon">
    <link rel="stylesheet" href="estilos/global.css">
    <link rel="stylesheet" href="estilos/odontologoDashboard.css">
    <link rel="stylesheet" href="estilos/adminDashboard.css">
    <link rel="stylesheet" href="estilos/header.css">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <link rel="stylesheet" href="estilos/responsive-mobile.css">
</head>

<body class="dashboard-cargando">
    <!-- ==========================================
 SKELETON PAGE - CARGA DEL DASHBOARD
========================================== -->
    <div class="skeleton-page" aria-label="Cargando dashboard">

        <!-- HEADER -->
        <div class="skeleton-header">
            <div class="skeleton-logo skeleton"></div>

            <div class="skeleton-menu">
                <div class="skeleton skeleton-menu-item"></div>
                <div class="skeleton skeleton-menu-item"></div>
            </div>

            <div class="skeleton-perfil">
                <div class="skeleton skeleton-circulo"></div>
                <div class="skeleton skeleton-nombre"></div>
                <div class="skeleton skeleton-flecha"></div>
            </div>
        </div>

        <!-- BIENVENIDA -->
        <div class="skeleton-banner">
            <div class="skeleton-banner-texto">
                <div class="skeleton skeleton-titulo-corto"></div>
                <div class="skeleton skeleton-titulo-largo"></div>
                <div class="skeleton skeleton-parrafo"></div>
                <div class="skeleton skeleton-parrafo skeleton-parrafo-corto"></div>
            </div>

            <div class="skeleton skeleton-diente"></div>
        </div>

        <!-- CONTENIDO PRINCIPAL -->
        <div class="skeleton-informacion">

            <!-- CITAS -->
            <div class="skeleton-seccion skeleton-citas">

                <div class="skeleton-encabezado">
                    <div class="skeleton skeleton-subtitulo"></div>
                    <div class="skeleton skeleton-icono"></div>
                </div>

                <div class="skeleton-linea"></div>

                <div class="skeleton-tarjetas">
                    <div class="skeleton skeleton-tarjeta-cita"></div>
                    <div class="skeleton skeleton-tarjeta-cita"></div>
                    <div class="skeleton skeleton-tarjeta-cita"></div>
                </div>

                <div class="skeleton skeleton-boton"></div>
            </div>


        </div>

    </div>
    <!-- FIN SKELETON PAGE -->
    <div class="contenedor-principal cargando">


        <div class="header" id="header">
            <img src="iconos/logo.png" alt="logo">
            <button class="hamburger-btn" id="hamburger-btn" type="button" aria-label="Abrir menú"
                aria-expanded="false">
                <i class="bi bi-list" aria-hidden="true"></i>
            </button>


            <div class="menu" id="menu">
                <a href="#" class="opcion activo">Inicio</a>
                <a href="recursos/odontologoCitas.html" class="opcion">Citas</a>
                <div class="linea-flotante"></div>
            </div>

            <div class="perfil-contenedor">

                <div class="perfil" id="btnPerfilDropdown">
                    <button class="btn-perfil"><img class="pfp" src="iconos/perfil.png" alt=""></button>
                    <p id="header-nombre-usuario"></p>
                    <i class="bi bi-chevron-down flecha-perfil"></i>
                </div>

                <div class="dropdown-perfil" id="dropdownPerfil">
                    <a href="recursos/perfil.html" class="dropdown-item">
                        <i class="bi bi-gear"></i> Configuración de cuenta
                    </a>
                    <hr class="dropdown-divisor">
                    <a href="#" id="btnCerrarSesion" class="dropdown-item texto-peligro">
                        <i class="bi bi-box-arrow-right"></i> Cerrar sesión
                    </a>
                </div>
            </div>

        </div>

        <div class="contenedor" id="contenedor">
            <div class="texto-bienvenida">
                <h2 id="bienvenida-usuario"></h2>
                <h1>Tu agenda profesional</h1>
                <p>Consulta y administra visualmente tus citas asignadas.</p>
                </p>
            </div>

            <img src="iconos/diente_kawaii.png" alt="">
        </div>

        <div class="informacion">
            <div class="citas">
                <div class="encabezado">
                    <div class="titulos">
                        <p class="titulo"><i class="bi bi-calendar-week"></i> Próximas citas</p>
                        <a id="ver" class="ver"><i class="bi bi-chevron-right"></i></a>
                    </div>

                    <hr class="linea">
                </div>

                <div class="agenda" id="agenda">
                    <div class="agenda-buscador">
                        <div class="buscador-campo">
                            <i class="bi bi-search" aria-hidden="true"></i>
                            <input type="search" id="buscar-paciente" aria-label="Buscar citas por paciente o servicio"
                                placeholder="Buscar por paciente o servicio..." autocomplete="off">
                            <button type="button" id="limpiar-busqueda" aria-label="Limpiar búsqueda" hidden><i
                                    class="bi bi-x-lg"></i></button>
                        </div>
                        <span id="resultado-busqueda" role="status" aria-live="polite"></span>
                    </div>

                    <div class="agenda-header">
                        <div class="titulo-fecha">
                            <p class="titulo">Agenda</p>
                            <p id="mes-anio-actual">Octubre 2026</p>
                        </div>

                        <div class="botones-fecha">
                            <button type="button" id="btn-anterior" class="btnfecha izquierda">
                                <i class="bi bi-chevron-left"></i>
                            </button>

                            <div class="agenda-calendario-anchor" id="agendaCalendarioAnchor">
                                <button type="button" id="btn-hoy" class="btnfecha actual">
                                    Hoy
                                </button>

                                <!-- Calendario flotante -->
                                <div class="cal-container agenda-calendario-popover" id="modalCalendarioAgenda"
                                    style="display: none;">

                                    <div class="cal-mes-nav">
                                        <button type="button" id="agenda-prev-month">
                                            <i class="bi bi-chevron-left"></i>
                                        </button>

                                        <h4 id="agenda-mes-anio"></h4>

                                        <button type="button" id="agenda-next-month">
                                            <i class="bi bi-chevron-right"></i>
                                        </button>
                                    </div>

                                    <div class="cal-grid">
                                        <div class="cal-dow">Do</div>
                                        <div class="cal-dow">Lu</div>
                                        <div class="cal-dow">Ma</div>
                                        <div class="cal-dow">Mi</div>
                                        <div class="cal-dow">Ju</div>
                                        <div class="cal-dow">Vi</div>
                                        <div class="cal-dow">Sá</div>

                                        <div id="agenda-dias-calendario" class="dias-grid"></div>
                                    </div>

                                    <button type="button" class="btn agregar-cita ancho-total" id="agenda-btn-hoy">
                                        Ir a hoy
                                    </button>
                                </div>
                            </div>

                            <button type="button" id="btn-siguiente" class="btnfecha derecha">
                                <i class="bi bi-chevron-right"></i>
                            </button>
                        </div>
                    </div>

                    <div class="div-dias" id="contenedor-dias">

                    </div>
                    <hr>
                    <div class="citas">
                        <div class="titulo-fecha">
                            <p class="titulo" id="titulo-citas-dia">Citas del día</p>
                            <p id="contador-citas-agenda">Cargando citas...</p>
                        </div>

                        <select id="filtro-servicio-citas" class="select">
                            <option value="">Todos los servicios</option>
                        </select>
                    </div>

                    <div id="lista-citas-agenda">
                        <p style="text-align:center; padding:20px;">
                            Cargando citas...
                        </p>
                    </div>

                </div>

            </div>
        </div>
    </div>
</body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="scripts/app.js"></script>
<script src="scripts/seguridadOdontologo.js"></script>
<script src="scripts/odontologoHeader.js"></script>
<script src="scripts/notificaciones.js"></script>
<script src="scripts/odontologo.js"></script>
<script src="scripts/dashCitas.js"></script>

</body>

</html>


</html>
